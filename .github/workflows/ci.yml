name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (ligeras, solo lo necesario para tests)
        run: pip install -r requirements-ci.txt

      - name: Correr pruebas
        run: pytest tests/ -v
